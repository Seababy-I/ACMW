<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events | ACM-W Manipal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #05070f;
      color: #fff;
      overflow-x: hidden;
      font-family: 'Fragment Mono', sans-serif;
    }

    /* ================= DOT GRID ================= */
    /* DOT GRID */
    .dot-grid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #dotCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* EVERYTHING ABOVE BACKGROUND */
    .navbar,
    .hero,
    .events {
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
    }

    .logo {
      height: 50px;
    }

    .logo img {
      height: 100%;
      width: auto;
    }

    .navbar nav {
      display: flex;
      gap: 30px;
    }

    .navbar nav a {
      text-decoration: none;
      color: #bbb;
      font-size: 20px;
      transition: color 0.3s;
    }

    .navbar nav a.active {
      color: #5a8fff;
    }

    .navbar nav a:hover {
      color: #fff;
    }

    .navbar-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 164px;
  z-index: 100;
  display: flex;
  align-items: center;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

.navbar-hidden {
  transform: translateY(-100%);
  opacity: 0;
}

/* LOGO */
.nav-logo {
  padding-left: 48px;
  flex-shrink: 0;
}

.nav-logo img {
  width: 164px;
  height: 164px;
  object-fit: contain;
}

/* NAV PILL */
.nav-pill {
  position: absolute;
  left: 240px;
  top: 78px;
  width: 1125px;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(150, 128, 128, 0.13);
  border: 1px solid rgba(185, 176, 176, 0.46);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(2.5px);
  border-radius: 32px;
}

/* LINKS */
.nav-links {
  display: flex;
  gap: 48px;
  list-style: none;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.15em;
}

.nav-links li {
  position: relative;
  padding: 8px 24px;
  cursor: pointer;
}

.nav-links li::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(177, 170, 177, 0.126);
  border: 1px solid rgba(185, 176, 176, 0.46);
  border-radius: 32px;
  transform: scale(0);
  opacity: 0;
  transition: all 0.3s ease;
}

.nav-links li:hover::before {
  transform: scale(1);
  opacity: 1;
}

.nav-links span {
  position: relative;
  z-index: 1;
  color: white;
  transition: color 0.3s ease, transform 0.3s ease;
}

.nav-links li:hover span {
  color: #99399E;
  transform: scale(1.1);
}

.nav-links .active span {
  color: #5a8fff;
}

.nav-spacer {
  height: 180px; /* must cover pill + blur */
}


.page-content {
  position: relative;
  z-index: 20;
  isolation: isolate;
}

    /* ================= HERO ================= */
    .hero {
      padding: 80px 60px 40px;
      position: relative;
      z-index: 10;
    }

    .hero h1 {
      font-family: 'Stalinist One', sans-serif;
      font-size: 72px;
      letter-spacing: 8px;
    }

    .hero p {
      opacity: 0.7;
      margin-top: 10px;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .tab {
      padding: 12px 32px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s;
      font-family: 'Fragment Mono', sans-serif;
    }

    .tab.active {
      background: #5a8fff;
      color: #fff;
    }

    .tab:not(.active) {
      background: rgba(255,255,255,0.1);
      color: #bbb;
    }

    /* ================= EVENTS ================= */
    .events {
      padding: 40px 60px 80px;
      position: relative;
      z-index: 10;
    }

    /* ✅ CENTERED SINGLE EVENT */
    .events.single-event {
      display: block;
    }

    .wide-card {
      max-width: 1100px;
      margin: 0 auto;            /* ✅ TRUE CENTERING */
    }

    .card {
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(90, 143, 255, 0.2);
    }

    .card-image {
      height: 320px;
      position: relative;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-date {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .card-content {
      padding: 32px;
    }

    .card-title {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .card-desc {
      opacity: 0.7;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .card button {
      padding: 12px 28px;
      border-radius: 24px;
      border: none;
      background: #00d4d4;
      font-weight: 600;
      cursor: pointer;
    }

    .card button:hover {
      background: #00e8e8;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 15px 30px;
        flex-direction: column;
        gap: 15px;
      }
      .hero {
        padding: 40px 30px;
      }
      .hero h1 {
        font-size: 48px;
      }
      .events {
        padding: 30px;
      }
    }
  </style>
</head>

<body>

<div class="nav-spacer"></div>

<!-- DOT GRID -->
<section class="dot-grid">
  <canvas id="dotCanvas"></canvas>
</section>

<!-- NAVBAR -->
<nav id="navbar" class="navbar-wrapper">
  <div class="nav-logo">
    <img src="images/logo-removebg-preview.png" alt="ACM-W Logo">
  </div>
  <div class="nav-pill">
    <ul class="nav-links">
      <li><span>Home</span></li>
      <li><span>About Us</span></li>
      <li class="active"><span>Event</span></li>
      <li><span>Gallery</span></li>
      <li><span>Contact</span></li>
    </ul>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>EVENTS</h1>
  <p>Take a look at what we've been busy with!</p>

  <div class="tabs">
    <button class="tab active">Upcoming Events</button>
    <button class="tab" onclick="location.href='past-events.html'">Past Events</button>
  </div>
</section>

<!-- CENTERED TECHWEEK -->
<section class="events single-event">
  <div class="card wide-card">
    <div class="card-image">
      <img src="images/techweek_24cm_x_10cm_300dpi.png" alt="Techweek">
      <div class="card-date">January 28- February 2</div>
    </div>

    <div class="card-content">
      <div class="card-title">KAIROS TECHWEEK</div>
      <div class="card-desc">
        A week-long technical festival featuring workshops, talks,
        hack sessions, and hands-on experiences across multiple domains.
      </div>

      <button>Register</button>
    </div>
  </div>
</section>

<!-- DOT GRID JS (UNCHANGED) -->
<script>
const canvas = document.getElementById("dotCanvas");
const ctx = canvas.getContext("2d");

const config = { dotSize: 4, gap: 25, proximity: 150 ,baseColor: { r: 39, g: 30, b: 55 }};
let dots = [], mouse = { x:-999, y:-999, prevX:-999, prevY:-999 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.scale(dpr, dpr);

  dots = [];
  const cols = Math.ceil(window.innerWidth / (config.dotSize + config.gap));
  const rows = Math.ceil(window.innerHeight / (config.gap + config.dotSize));
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      dots.push({
        x: col * (config.dotSize + config.gap) + config.dotSize,
        y: row * (config.dotSize + config.gap) + config.dotSize,
        baseX: col * (config.dotSize + config.gap) + config.dotSize,
        baseY: row * (config.dotSize + config.gap) + config.dotSize,
        vx: 0,
        vy: 0
      });
    }
  }
}

function animate() {
   ctx.clearRect(0, 0, canvas.width, canvas.height);

  dots.forEach(dot => {
    // Calculate distance to mouse
    const dx = dot.baseX - mouse.x;
    const dy = dot.baseY - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Physics: push away from mouse when moving fast
    const mouseDx = mouse.x - mouse.prevX;
    const mouseDy = mouse.y - mouse.prevY;
    const mouseSpeed = Math.sqrt(mouseDx * mouseDx + mouseDy * mouseDy);

    if (dist < config.proximity && mouseSpeed > 2) {
      const force = (1 - dist / config.proximity) * 0.5;
      dot.vx += dx * force * 0.1;
      dot.vy += dy * force * 0.1;
    }

    // Apply velocity with damping
    dot.vx *= 0.85;
    dot.vy *= 0.85;
    dot.x += dot.vx;
    dot.y += dot.vy;

    // Spring back to base position
    const returnDx = dot.baseX - dot.x;
    const returnDy = dot.baseY - dot.y;
    dot.x += returnDx * 0.08;
    dot.y += returnDy * 0.08;

    // Calculate opacity based on distance to mouse
    let alpha = 0.3;
    if (dist < config.proximity) {
      alpha = 0.3 + (1 - dist / config.proximity) * 0.7;
    }

    // Draw dot
const color = dist < config.proximity
  ? { r: 28, g: 144, b: 206 } // #1C90CE
  : config.baseColor;

ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;    ctx.beginPath();
    ctx.arc(dot.x, dot.y, config.dotSize / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Update previous mouse position
  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;

  requestAnimationFrame(animate);
}

window.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener("resize",resize);
resize(); animate();
</script>

<script>
const navbar = document.getElementById("navbar");
window.addEventListener("scroll",()=>{
  navbar.classList.toggle("navbar-hidden", window.scrollY > 500);
});
</script>

</body>
</html>
