<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Past Events | ACM-W Manipal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Stalinist+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Porter Sans Block';
      src: url('https://assets.codepen.io/4927073/PorterSansBlock.woff2') format('woff2'),
           url('https://assets.codepen.io/4927073/PorterSansBlock.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #05070f;
      color: #fff;
      overflow-x: hidden;
      font-family: 'Fragment Mono', sans-serif;
    }

    .dot-grid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #dotCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .navbar,
    .hero,
    .timeline-container {
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
    }

    .logo {
      height: 50px;
    }

    .logo img {
      height: 100%;
      width: auto;
    }

    .navbar nav {
      display: flex;
      gap: 30px;
    }

    .navbar nav a {
      text-decoration: none;
      color: #bbb;
      font-size: 16px;
      transition: color 0.3s;
    }

    .navbar nav a.active {
      color: #5a8fff;
    }

    .navbar nav a:hover {
      color: #fff;
    }

    .navbar-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 164px;
  z-index: 100;
  display: flex;
  align-items: center;
  transition: transform 0.5s ease, opacity 0.5s ease;
}

.navbar-hidden {
  transform: translateY(-100%);
  opacity: 0;
}

/* LOGO */
.nav-logo {
  padding-left: 48px;
  flex-shrink: 0;
}

.nav-logo img {
  width: 164px;
  height: 164px;
  object-fit: contain;
}

/* NAV PILL */
.nav-pill {
  position: absolute;
  left: 240px;
  top: 78px;
  width: 1125px;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(150, 128, 128, 0.13);
  border: 1px solid rgba(185, 176, 176, 0.46);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(2.5px);
  border-radius: 32px;
}

/* LINKS */
.nav-links {
  display: flex;
  gap: 48px;
  list-style: none;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.15em;
}

.nav-links li {
  position: relative;
  padding: 8px 24px;
  cursor: pointer;
}

.nav-links li::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(177, 170, 177, 0.126);
  border: 1px solid rgba(185, 176, 176, 0.46);
  border-radius: 32px;
  transform: scale(0);
  opacity: 0;
  transition: all 0.3s ease;
}

.nav-links li:hover::before {
  transform: scale(1);
  opacity: 1;
}

.nav-links span {
  position: relative;
  z-index: 1;
  color: white;
  transition: color 0.3s ease, transform 0.3s ease;
}

.nav-links li:hover span {
  color: #99399E;
  transform: scale(1.1);
}

.nav-links .active span {
  color: #5a8fff;
}

.nav-spacer {
  height: 180px; /* must cover pill + blur */
}


.page-content {
  position: relative;
  z-index: 20;
  isolation: isolate;
}

    .hero {
      padding: 80px 60px 40px;
      text-align: left;
    }

    .hero h1 {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 8px;
      margin-bottom: 10px;
      font-family: 'Stalinist One', sans-serif;
    }
    
   
    .hero p {
      font-size: 18px;
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .tab {
      padding: 12px 32px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s;
      font-family: 'Fragment Mono', sans-serif;
    }

    .tab.active {
      background: #5a8fff;
      color: #fff;
    }

    .tab:not(.active) {
      background: rgba(255,255,255,0.1);
      color: #bbb;
    }

    .tab:not(.active):hover {
      background: rgba(255,255,255,0.15);
    }

   /* TIMELINE WRAPPER */
.infographic-timeline {
  position: relative;
  max-width: 1400px;
  height: 300px; /* IMPORTANT: matches SVG viewBox */
  margin: 0 auto;
}

/* SVG */
.timeline-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* EXTRA LIFT for peak pins (prevents overlap on crests) */
.timeline-pin.peak {
  top: 30px;   /* higher than normal 'up' (55px) */
}


/* PIN BASE */
.timeline-pin {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s ease;
}

/* THESE VALUES ALIGN PINS TO THE CURVE */
.timeline-pin.up { top: 55px; }
.timeline-pin.down { top: 185px; }

/* YEAR TEXT */
.timeline-pin span {
  display: block;
  margin-bottom: 6px;
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  transition: transform 0.3s ease, color 0.3s ease;
}

/* PIN ICON */
.timeline-pin .pin {
  width: 44px;
  height: 44px;
  background: #00e5e5;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 0 22px rgba(0,229,229,0.75);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* HOVER EFFECTS */
.timeline-pin:hover {
  transform: translateX(-50%) scale(1.15);
}

.timeline-pin:hover span {
  transform: scale(1.3);
  color: #22d3ee;
}

.timeline-pin:hover .pin {
  box-shadow: 0 0 40px rgba(0,229,229,1);
}


    .timeline-container {
      padding: 80px 60px;
      position: relative;
      min-height: 500px;
    }

    

.timeline-image {
  width: 100%;
  height: auto;
  display: block;
  pointer-events: none;
}



    .timeline-year-label {
      position: absolute;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      z-index: 5;
    }

    .timeline-wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
    }

    .wave-path {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
    }

    



.location-pin:hover .pin-icon {
  transform: rotate(-45deg) scale(1.15);
}


    .pin-logo {
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
    }

    .pin-2019 {
  transform: translate(-50%, -250%);
}

/* LOWER DOWN pins (for deeper curve dips like 2024) */
.timeline-pin.down.low {
  top: 215px;
}



     

    @media (max-width: 768px) {
      .navbar {
        padding: 15px 30px;
        flex-direction: column;
        gap: 15px;
      }

      .hero {
        padding: 40px 30px 30px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .timeline-container {
        padding: 50px 30px;
      }

      .timeline-year-label {
        font-size: 18px;
      }

      .pin-icon {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="nav-spacer"></div>

<section class="dot-grid">
  <canvas id="dotCanvas"></canvas>
</section>

<!-- NAVBAR -->
<nav id="navbar" class="navbar-wrapper">
  <!-- LOGO -->
  <div class="nav-logo">
    <img src="images/logo-removebg-preview.png" alt="ACM-W Logo">
  </div>

  <!-- NAV PILL -->
  <div class="nav-pill">
    <ul class="nav-links">
      <li><span>Home</span></li>
      <li><span>About Us</span></li>
      <li class="active"><span>Event</span></li>
      <li><span>Gallery</span></li>
      <li><span>Contact</span></li>
    </ul>
  </div>
</nav>


<section class="hero">
  <h1>EVENTS</h1>
  <p>Take a look at what we've been busy with!</p>

  <div class="tabs">
    <button class="tab" onclick="window.location.href='upcoming-events.html'">Upcoming Events</button>
    <button class="tab active">Past Events</button>
  </div>
</section>

<section class="timeline-container">

<div class="timeline-image-wrapper infographic-timeline">

  <!-- CURVED TIMELINE -->
  <svg viewBox="0 0 1200 300" class="timeline-svg" preserveAspectRatio="xMidYMid meet"
>
    <defs>
      <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>

    <!-- BASELINE AT y = 150 -->
    <path
  d="
    M 0 180
    C 150 120, 300 240, 450 180
    S 750 120, 900 180
    S 1050 240, 1200 180
  "
  fill="none"
  stroke="url(#timelineGradient)"
  stroke-width="10"
  stroke-linecap="round"
/>

  </svg>

  <!-- PINS (now positioned relative to the curve) -->
  <div class="timeline-pin up" style="left:6%" onclick="window.location.href='2019/index.html'">
    <span>2019</span><div class="pin"></div>
  </div>

  <div class="timeline-pin down" style="left:20%" onclick="window.location.href='2020/index.html'">
    <span>2020</span><div class="pin"></div>
  </div>

  <div class="timeline-pin up" style="left:34%" onclick="window.location.href='2021/index.html'">
    <span>2021</span><div class="pin"></div>
  </div>

  <div class="timeline-pin down" style="left:48%" onclick="window.location.href='2022/index.html'">
    <span>2022</span><div class="pin"></div>
  </div>

  <div class="timeline-pin up peak" style="left:62%" onclick="window.location.href='2023/index.html'">
  <span>2023</span><div class="pin"></div>
</div>


  <div class="timeline-pin down low" style="left:76%" onclick="window.location.href='2024/index.html'">

    <span>2024</span><div class="pin"></div>
  </div>

  <div class="timeline-pin up" style="left:90%" onclick="window.location.href='2025/index.html'">
    <span>2025</span><div class="pin"></div>
  </div>

</div>




</section>

<script>
const canvas = document.getElementById("dotCanvas");
const ctx = canvas.getContext("2d");

const config = {
  dotSize: 4,
  gap: 25,
  proximity: 150,
  baseColor: { r: 39, g: 30, b: 55 }
};

let dots = [];
let mouse = { x: -999, y: -999, prevX: -999, prevY: -999 };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.scale(dpr, dpr);

  dots = [];
  const cols = Math.ceil(window.innerWidth / (config.dotSize + config.gap));
  const rows = Math.ceil(window.innerHeight / (config.gap + config.dotSize));

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      dots.push({
        x: col * (config.dotSize + config.gap) + config.dotSize,
        y: row * (config.dotSize + config.gap) + config.dotSize,
        baseX: col * (config.dotSize + config.gap) + config.dotSize,
        baseY: row * (config.dotSize + config.gap) + config.dotSize,
        vx: 0,
        vy: 0
      });
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  dots.forEach(dot => {
    const dx = dot.baseX - mouse.x;
    const dy = dot.baseY - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    const mouseDx = mouse.x - mouse.prevX;
    const mouseDy = mouse.y - mouse.prevY;
    const mouseSpeed = Math.sqrt(mouseDx * mouseDx + mouseDy * mouseDy);

    if (dist < config.proximity && mouseSpeed > 2) {
      const force = (1 - dist / config.proximity) * 0.5;
      dot.vx += dx * force * 0.1;
      dot.vy += dy * force * 0.1;
    }

    dot.vx *= 0.85;
    dot.vy *= 0.85;
    dot.x += dot.vx;
    dot.y += dot.vy;

    const returnDx = dot.baseX - dot.x;
    const returnDy = dot.baseY - dot.y;
    dot.x += returnDx * 0.08;
    dot.y += returnDy * 0.08;

    let alpha = 0.3;
    if (dist < config.proximity) {
      alpha = 0.3 + (1 - dist / config.proximity) * 0.7;
    }

const color = dist < config.proximity
  ? { r: 28, g: 144, b: 206 } // #1C90CE
  : config.baseColor;

ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;    ctx.beginPath();
    ctx.arc(dot.x, dot.y, config.dotSize / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  mouse.prevX = mouse.x;
  mouse.prevY = mouse.y;

  requestAnimationFrame(animate);
}

window.addEventListener("mousemove", (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener("click", (e) => {
  const clickX = e.clientX;
  const clickY = e.clientY;

  dots.forEach(dot => {
    const dx = dot.baseX - clickX;
    const dy = dot.baseY - clickY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 250) {
      const force = (1 - dist / 250) * 15;
      dot.vx += (dx / dist) * force;
      dot.vy += (dy / dist) * force;
    }
  });
});

window.addEventListener("resize", resize);

resize();
animate();
</script>
<script>
  const navbar = document.getElementById("navbar");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 500) {
      navbar.classList.add("navbar-hidden");
    } else {
      navbar.classList.remove("navbar-hidden");
    }
  });
</script>

</body>
